name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-10-26'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: make unit
