name: nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  OSS_CAD_SUITE: '2026-10-26'

jobs:
  perf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: make perf experiments
      - uses: actions/upload-artifact@v7
        with:
          name: perf
          path: |
            results/correlation.*
            results/mapping.json
            results/sweep.json
            results/*.png

  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: make mutate
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation
          path: |
            results/mutation.*
            build/mut/*/d*.log
